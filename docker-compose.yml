x-yaat-common: &yaat-common
  image: python:3.12-slim
  volumes:
    - .:/repo
  working_dir: /repo
  depends_on:
    - mongo

services:

  mongo:
    image: mongo:latest
    volumes:
      - ./mongo.conf:/etc/mongo.conf:ro
      - ./storage/db:/data/db
    ports:
      - "27017:27017"
    command: ["mongod", "--config", "/etc/mongo.conf"]

  yaat:
    <<: *yaat-common
    depends_on:
      - mongo
    ports:
      - "80:80"
    environment:
      - COINGECKO_KEY=${COINGECKO_KEY:-__no_key__}
    command: /bin/sh -c "pip install -e . && python main.py"
    healthcheck:
      test: ["CMD", "python", "-m", "httpie", "localhost:8000"]
      interval: 10s
      timeout: 2s
      retries: 30
