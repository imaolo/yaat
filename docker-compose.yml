x-mount: &mount
  volumes:
    - .:/repo
  working_dir: /repo


services:

  mongo:
    image: mongo:latest
    volumes:
      - ./mongo.conf:/etc/mongo.conf:ro
      - ./storage/db:/data/db
    ports:
      - "27017:27017"
    command: ["mongod", "--config", "/etc/mongo.conf"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 30s
      timeout: 3s
      retries: 10

  build-frontend:
    <<: *mount
    working_dir: /repo/yaat/client
    image: node:18
    command: ["/bin/sh", "-c", "npm install && npm run build"]

  yaat:
    <<: *mount
    image: python:3.12-slim
    depends_on:
      - mongo
      - build-frontend
    ports:
      - "80:80"
    environment:
      - COINGECKO_KEY=${COINGECKO_KEY:-__no_key__}
      - DOCKER=1
    command: /bin/sh -c "pip install -e . && python main.py"
    healthcheck:
      test: ["CMD", "python", "-m", "httpie", "GET", "localhost/heartbeat"]
      interval: 30s
      timeout: 3s
      retries: 10
